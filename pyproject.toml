[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-preparation-agent"
version = "0.1.0"
description = "Evidence-based placement preparation with a bounded Foundry agent"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
# Resolve and lock these dependencies during P02/P04 before release.
persistence = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
