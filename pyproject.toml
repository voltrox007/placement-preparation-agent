[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-preparation-agent"
version = "0.1.0"
description = "Evidence-based placement preparation with a bounded Foundry agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.20.0",
  "azure-ai-projects==2.7.0",
  "azure-identity==1.25.3",
  "azure-search-documents==12.0.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pypdf==6.19.0",
  "SQLAlchemy==2.0.54",
  "streamlit==1.64.0",
]

[project.optional-dependencies]
dev = ["mypy==2.3.1", "pytest==9.1.1", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
