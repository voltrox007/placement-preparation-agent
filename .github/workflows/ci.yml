name: Offline foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12.14", "3.13.5"]
    env:
      LIVE_AI_ENABLED: "false"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests/unit -p test_config.py -v
      - run: python -m compileall -q src
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12.14", "3.13.5"]
    env:
      LIVE_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src
  # No cloud credentials or paid model invocations are configured.
